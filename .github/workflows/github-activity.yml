name: Refresh GitHub activity data

# Regenerates data/github-contributions.json for the heatmap on the portfolio.
# Uses the workflow's built-in token, so no personal access token is needed
# and nothing secret is ever shipped to the website.

on:
  schedule:
    - cron: '23 1 * * *'   # daily, 01:23 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # needed to commit the refreshed JSON
  pages: write              # needed to ask GitHub Pages to rebuild after the commit

concurrency:
  group: github-activity
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch contribution calendar
        run: node scripts/fetch-github-contributions.mjs "${{ github.repository_owner }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github-contributions.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh GitHub activity data"
            git pull --rebase origin "${{ github.ref_name }}"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        id: commit

      # Pushes made with the built-in token do not always start a Pages build,
      # so ask for one directly. Best effort: never fail the job over this.
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        run: gh api --method POST "/repos/${{ github.repository }}/pages/builds" || echo "Pages rebuild request skipped"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
